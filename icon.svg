<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b28cc"/>
      <stop offset="50%" stop-color="#5433d6"/>
      <stop offset="100%" stop-color="#1478ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0a0a3a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Inner Soft Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

  <!-- Calendar Base (Frosted Glass) -->
  <g filter="url(#shadow)">
    <rect x="96" y="120" width="240" height="240" rx="36" fill="url(#glass)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
    
    <!-- Calendar Header Bar -->
    <path d="M 96 170 L 336 170" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    
    <!-- Calendar Rings -->
    <rect x="140" y="96" width="16" height="40" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="190" y="96" width="16" height="40" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="240" y="96" width="16" height="40" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="290" y="96" width="16" height="40" rx="8" fill="#ffffff" opacity="0.9"/>

    <!-- Calendar Grid Dots & Bars -->
    <circle cx="150" cy="216" r="10" fill="#ffffff" opacity="0.8"/>
    <circle cx="216" cy="216" r="10" fill="#ffffff" opacity="0.8"/>
    <circle cx="282" cy="216" r="10" fill="#ffffff" opacity="0.5"/>

    <circle cx="150" cy="272" r="10" fill="#ffffff" opacity="0.5"/>
    <rect x="196" y="264" width="96" height="16" rx="8" fill="#67e8f9" opacity="0.95"/>
    
    <circle cx="150" cy="324" r="10" fill="#ffffff" opacity="0.5"/>
    <circle cx="216" cy="324" r="10" fill="#ffffff" opacity="0.5"/>
    <circle cx="282" cy="324" r="10" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Foreground Glass Clock -->
  <g filter="url(#shadow)">
    <circle cx="340" cy="330" r="100" fill="#1e1b4b" fill-opacity="0.75" stroke="rgba(255,255,255,0.6)" stroke-width="5"/>
    <circle cx="340" cy="330" r="88" fill="url(#glass)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    
    <!-- Clock Center Dot -->
    <circle cx="340" cy="330" r="8" fill="#67e8f9"/>
    
    <!-- Clock Hands (Time around 10:10) -->
    <line x1="340" y1="330" x2="300" y2="290" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/>
    <line x1="340" y1="330" x2="390" y2="275" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Subtle Hour Markers -->
    <circle cx="340" cy="254" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="416" cy="330" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="340" cy="406" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="264" cy="330" r="5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
